name: Package Node workspace
on:
  workflow_dispatch:
  push:
    branches: [node_version, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: kurapika-node
          path: build/kurapika.mjs
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: node-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kurapika-node
      - name: Publish the tested launcher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! release=$(gh release view "$TAG" --json isDraft,assets); then
            gh release create "$TAG" kurapika.mjs --verify-tag --title "Kurapika $TAG" \
              --notes 'Download `kurapika.mjs` and run `node kurapika.mjs` with Node.js 22 or newer. Open <http://127.0.0.1:4173/> in your browser.'
            exit 0
          fi

          if ! jq -e 'any(.assets[]; .name == "kurapika.mjs" and .state == "uploaded")' <<< "$release" > /dev/null; then
            gh release upload "$TAG" kurapika.mjs
          fi
          if jq -e '.isDraft' <<< "$release" > /dev/null; then
            gh release edit "$TAG" --draft=false
          fi
