name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify build output
        run: test -s dist/index.html
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..12}; do
            if gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate               --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id'               | tr -d '\r' | grep -Fxq "$ARTIFACT_ID"; then
              echo "Pages artifact $ARTIFACT_ID is available."
              exit 0
            fi
            echo "Waiting for Pages artifact discovery (attempt $attempt/12)."
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become discoverable within 60 seconds."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
