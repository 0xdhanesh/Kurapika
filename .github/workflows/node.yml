name: Package Node workspace
on:
  workflow_dispatch:
  push:
    branches: [node_version, main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: kurapika-node
          path: build/kurapika.mjs
          if-no-files-found: error
